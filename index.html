<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Robot Race</title><style>
*{box-sizing:border-box}body{margin:0;background:#071322;color:#f3f8ff;font-family:system-ui,Arial;overflow:hidden}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 20px;font-weight:800;background:#13d8ad;color:#062b2b}button:disabled{opacity:.45}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}.brand{font-weight:1000;font-size:clamp(20px,4vw,30px);letter-spacing:2px}.pill{background:#10283de8;padding:9px 14px;border:1px solid #34516a;border-radius:20px;font-size:13px}#scene{width:100vw;height:100dvh;display:block;touch-action:none}#panel{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(94vw,650px);background:#0d2338ee;border:1px solid #41607a;border-radius:22px;padding:18px;z-index:6;box-shadow:0 12px 45px #0009}#panel h2{margin:0 0 8px;font-size:clamp(20px,4vw,28px)}#panel p{font-size:clamp(14px,2.6vw,18px);line-height:1.5;margin:6px 0 15px;color:#d1e1ef}.panelrow{display:flex;gap:12px;align-items:center;justify-content:space-between}.count{font-size:13px;color:#8deed8}.checks{display:flex;gap:6px;margin-top:12px}.check{height:7px;flex:1;border-radius:5px;background:#34526a}.check.done{background:#13d8ad}#controls{position:absolute;bottom:18px;left:14px;right:14px;display:none;justify-content:space-between;align-items:end;pointer-events:none;z-index:7}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:5px;pointer-events:auto}.pad button{padding:0;width:56px;height:56px;font-size:26px;touch-action:none;background:#183f5fe8;color:white;border:1px solid #6c9ebd}.pad .empty{visibility:hidden}.actions{display:flex;flex-direction:column;gap:9px;pointer-events:auto}.actions button{min-width:110px;background:#e7a944;color:#1c2030}#message{position:absolute;top:68px;left:50%;transform:translateX(-50%);z-index:5;background:#0b253bdc;border-radius:12px;padding:10px 18px;text-align:center;max-width:85vw}#help{position:absolute;bottom:210px;left:50%;transform:translateX(-50%);font-size:13px;color:#9ab8d0;text-align:center;width:90vw}#part{position:absolute;top:22%;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;transition:all .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 12px 20px #0008)}#part.fly{top:49%;left:50%;opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(45deg)}.component{position:relative;width:120px;height:90px;display:grid;place-items:center}.motor{width:105px;height:53px;background:linear-gradient(135deg,#9ea8b5,#485c70);border-radius:14px;border:5px solid #d3dce4;box-shadow:inset -15px -8px #334558}.motor:after{content:'';position:absolute;width:45px;height:12px;background:#e5bb58;right:-31px;border-radius:5px}.board{width:130px;height:80px;border-radius:8px;background:#126f90;border:5px solid #183d57;box-shadow:inset 0 0 0 8px #168eb4}.board:before{content:'ARDUINO';font-size:13px;color:white;letter-spacing:2px}.driver{width:110px;height:90px;background:#176b5c;border:5px solid #0a4338;border-radius:7px}.driver:before{content:'L298N';font-weight:900;background:#252c34;padding:13px;color:white}.servo{width:95px;height:64px;background:#1966b2;border:5px solid #9ac8ec;border-radius:9px}.servo:before{content:'⚙';font-size:45px;color:white;position:absolute;top:-32px}.chassis{width:130px;height:80px;background:#687a8e;border:7px solid #c2d0dc;border-radius:20px}.chassis:before{content:'CHASIS';font-size:14px;color:white}#partName{position:absolute;top:17%;width:100%;text-align:center;color:#83e8d5;font-weight:900;letter-spacing:2px}#restart{position:absolute;top:60px;right:12px;z-index:8;background:#183f5f;color:white;padding:8px 12px;font-size:12px} @media(max-width:500px){#panel{bottom:10px;padding:15px}#controls{bottom:12px}.pad{grid-template-columns:repeat(3,50px)}.pad button{width:50px;height:50px}#help{bottom:190px}}
</style></head><body><div id="hud"><div class="brand">🤖 ROBOT <span style="color:#13d8ad">RACE</span></div><div class="pill" id="phase">FASE 1 · ENSAMBLAJE</div></div><button id="restart">↻ Reiniciar</button><canvas id="scene"></canvas><div id="partName"></div><div id="part"></div><div id="message">¡Construye tu robot para comenzar!</div><section id="panel"><h2 id="heading"></h2><p id="desc"></p><div class="panelrow"><span class="count" id="counter"></span><button id="assemble">Ensamblar →</button></div><div class="checks" id="checks"></div></section><div id="help"></div><div id="controls"><div class="pad"><span class="empty"></span><button data-key="up">▲</button><span class="empty"></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div class="actions"><button id="grab">✋ Tomar</button><button id="drop">📦 Soltar</button></div></div>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const parts=[{name:'Chasis',type:'chassis',description:'El chasis es la estructura que sostiene todos los componentes. Proporciona estabilidad y soporte mecánico al robot.'},{name:'Motores DC',type:'motor',description:'Los motores de corriente continua transforman energía eléctrica en movimiento rotatorio. Hacen girar las ruedas para desplazar el carrito.'},{name:'Driver L298N',type:'driver',description:'El L298N es un controlador de motores. Permite al Arduino cambiar el sentido de giro y regular la velocidad de los motores DC.'},{name:'Arduino',type:'board',description:'Arduino es el cerebro del robot. Ejecuta instrucciones, recibe información y envía señales a los motores y servomotores.'},{name:'Servomotores',type:'servo',description:'Los servomotores permiten controlar posiciones angulares precisas. Mueven las articulaciones del brazo y su pinza.'}];
let step=0,mode='build',robot={x:0,z:0,angle:0},carrying=false,object={x:0,z:13},keys={},last=0,anim=0;
const $=s=>document.querySelector(s);function panel(){if(step>=parts.length){mode='race';$('#panel').style.display='none';$('#part').style.display='none';$('#partName').style.display='none';$('#controls').style.display='flex';$('#phase').textContent='FASE 2 · CARRERA';$('#message').textContent='Conduce hasta el cubo amarillo, tómalo y llévalo a la meta';$('#help').textContent='▲▼ avanzar / retroceder · ◀▶ girar · ✋ recoger · 📦 entregar';return}let p=parts[step];$('#heading').textContent=p.name;$('#desc').textContent=p.description;$('#counter').textContent='Componente '+(step+1)+' de '+parts.length;$('#part').innerHTML='<div class="component"><div class="'+p.type+'"></div></div>';$('#part').classList.remove('fly');$('#partName').textContent=p.name;$('#checks').innerHTML=parts.map((_,i)=>'<div class="check '+(i<step?'done':'')+'"></div>').join('');$('#message').textContent='Robot en construcción · '+step+'/'+parts.length+' componentes'}panel();
$('#assemble').onclick=()=>{if(anim)return;anim=1;$('#assemble').disabled=true;$('#part').classList.add('fly');setTimeout(()=>{step++;anim=0;$('#assemble').disabled=false;panel()},750)};
$('#restart').onclick=()=>location.reload();
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[{ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key]=true;if(e.key===' ')grab()});addEventListener('keyup',e=>keys[{ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key]=false);
function distance(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}function grab(){if(mode!=='race'||carrying)return;if(distance(robot,object)<2.7){carrying=true;$('#message').textContent='¡Objeto recogido! Ahora llega a la meta'}else $('#message').textContent='Acércate al cubo amarillo para recogerlo'}function drop(){if(!carrying)return;if(robot.z>28&&Math.abs(robot.x)<4){mode='win';$('#message').textContent='🏆 ¡MISIÓN COMPLETADA! ¡Ganaste Robot Race!';$('#phase').textContent='¡VICTORIA!';$('#controls').style.display='none'}else{$('#message').textContent='Lleva el objeto a la zona verde antes de soltarlo';}}$('#grab').onclick=grab;$('#drop').onclick=drop;
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function rr(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function render(t){let dt=Math.min((t-last)/1000||0,.05);last=t;ctx.clearRect(0,0,W,H);let horizon=H*.42;ctx.fillStyle='#0a1b2e';ctx.fillRect(0,0,W,H);ctx.fillStyle='#102e3b';ctx.fillRect(0,horizon,W,H-horizon);let cx=W/2,cy=H*.48;
if(mode==='build'){let scale=Math.min(W/450,H/680,1.5),bx=cx,by=cy+25;ctx.save();ctx.translate(bx,by);ctx.scale(scale,scale);ctx.globalAlpha=.25;drawRobot(0,0,1);ctx.globalAlpha=1;for(let i=0;i<step;i++){ctx.fillStyle='#12d9a9';ctx.font='bold 19px system-ui';ctx.fillText('✓',-100+i*44,135)}ctx.restore();ctx.strokeStyle='#2c627a';ctx.lineWidth=1;for(let i=0;i<12;i++){let y=horizon+(H-horizon)*i/12;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
else{if(mode==='race'){if(keys.left)robot.angle-=2.1*dt;if(keys.right)robot.angle+=2.1*dt;let speed=(keys.up?1:0)-(keys.down?1:0);let nx=robot.x+Math.sin(robot.angle)*speed*7*dt,nz=robot.z+Math.cos(robot.angle)*speed*7*dt;if(Math.abs(nx)<5.1&&nz>-2&&nz<34){robot.x=nx;robot.z=nz}}let cameraZ=robot.z-6;function project(x,z){let depth=z-cameraZ+5;let s=1/(1+Math.max(-3,depth)*.052);return [cx+(x-robot.x)*W*.11*s,horizon+(H-horizon)*(.25+depth*.027)*s,s]}let p1=project(-5,cameraZ-2),p2=project(5,cameraZ-2),p3=project(5,cameraZ+42),p4=project(-5,cameraZ+42);poly([p1,p2,p3,p4],'#344b5b','#718a96');for(let z=Math.floor(cameraZ/4)*4;z<cameraZ+45;z+=4){let a=project(0,z),b=project(0,z+1.6);ctx.strokeStyle='#f6c95c';ctx.lineWidth=Math.max(2,7*a[2]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}let goal=project(0,30);rr(goal[0]-W*.27*goal[2],goal[1]-7,W*.54*goal[2],14,4,'#0ee7a6');ctx.fillStyle='#dcfff6';ctx.font='bold 15px system-ui';ctx.fillText('META',goal[0]-20,goal[1]-15);if(!carrying){let o=project(object.x,object.z);rr(o[0]-15*o[2],o[1]-22*o[2],30*o[2],30*o[2],3,'#ffc447')}ctx.save();ctx.translate(cx,H*.71);ctx.scale(Math.min(W/420,1.2),Math.min(W/420,1.2));drawRobot(0,0,1);if(carrying){rr(-12,-115,24,24,3,'#ffc447')}ctx.restore();if(mode==='win'){ctx.fillStyle='#0a1b2ecc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.fillText('🏆 ¡VICTORIA!',cx,H*.45);ctx.font='18px system-ui';ctx.fillText('Completaste la misión',cx,H*.51);ctx.textAlign='left'}}
requestAnimationFrame(render)}
function drawRobot(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);poly([[-105,30],[-75,-15],[70,-15],[105,30],[65,77],[-65,77]],'#5f879b','#a4cad8');for(let a of [-1,1]){rr(a*77-18,12,36,65,13,'#17212d');rr(a*77-13,21,26,45,10,'#293c4d')}poly([[-75,-22],[-45,-55],[48,-55],[76,-22],[54,32],[-53,32]],'#198fa0','#6ed7dc');rr(-32,-42,65,39,5,'#156580');ctx.fillStyle='#e1f9ff';ctx.font='bold 12px system-ui';ctx.fillText('ARDUINO',-25,-18);rr(30,5,40,27,4,'#1a7159');rr(39,8,20,20,2,'#26323b');ctx.strokeStyle='#b5d7e8';ctx.lineWidth=15;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(-15,-82);ctx.lineTo(22,-117);ctx.stroke();ctx.strokeStyle='#e8a846';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(-15,-82);ctx.lineTo(22,-117);ctx.stroke();for(let [a,b] of [[-15,-82],[22,-117]]){ctx.beginPath();ctx.arc(a,b,11,0,Math.PI*2);ctx.fillStyle='#d6e8ef';ctx.fill();ctx.beginPath();ctx.arc(a,b,5,0,Math.PI*2);ctx.fillStyle='#4b7891';ctx.fill()}ctx.strokeStyle='#d6e8ef';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(22,-117);ctx.lineTo(10,-135);ctx.moveTo(22,-117);ctx.lineTo(36,-135);ctx.stroke();ctx.restore()}
requestAnimationFrame(render);
</script></body></html>
