box(wrist,.5,.1,.2,M.white,0,.05,0);
const all=[chassis,motors,driver,board,servos];
const descriptions=[
['Chasis y ruedas','Soporta los componentes y distribuye su peso. Las cuatro ruedas permiten desplazarse y mantener la estabilidad.'],
['Motores DC','Convierten energía eléctrica en movimiento. Sus reductores aumentan el torque para impulsar las ruedas.'],
['Driver L298N','Controla el sentido de giro de dos motores DC y regula su velocidad mediante señales PWM del Arduino.'],

['Servomotores y brazo','Posicionan la base, el hombro, el codo y la pinza para alcanzar, sujetar y levantar objetos.']

let showcase=null;const showcaseAnchor=new THREE.Group();scene.add(showcaseAnchor);showcaseAnchor.position.set(.7,1.65,2.0);const spinPivot=new THREE.Group();showcaseAnchor.add(spinPivot);let step=0,mode='build',carrying=false,animating=false,keys={},car={x:0,z:0,a:0},orbit=0,last=0,elapsed=0;
const ground=box(scene,220,.18,220,mat('#263e3b'),0,-.14,35);
const track=box(scene,12,.06,116,M.road,0,-.025,53);const trackDecor=new THREE.Group();scene.add(trackDecor);
for(let z=-3;z<109;z+=4){box(trackDecor,.13,.025,2,M.stripe,0,.023,z);for(const x of [-6.05,6.05]){box(trackDecor,.12,.025,3.7,M.white,x,.025,z)}}
for(let z=0;z<109;z+=4)for(const x of [-7.5,7.5]){const a=cyl(trackDecor,.25,.25,.12,mat(z%8?'#558a65':'#6e9e75'),x,.05,z);a.castShadow=false}

const goal=new THREE.Group();scene.add(goal);goal.position.set(0,0,finishZ);
const glowMat=new THREE.MeshStandardMaterial({color:0x13bca0,emissive:0x0bb88c,emissiveIntensity:1.4,transparent:true,opacity:.7});
box(goal,finishSize,.045,finishSize,mat('#173c3d'),0,.055,0);
for(const side of [-1,1]){box(goal,finishSize,.13,.16,glowMat,0,.13,side*finishSize/2);box(goal,.16,.13,finishSize,glowMat,side*finishSize/2,.13,0)}
const receiver=new THREE.Group();goal.add(receiver);receiver.rotation.y=Math.PI;
const bodyMat=mat('#91a6b7',.45,.35),jointMat=mat('#223d54',.35);
box(receiver,1.25,1.15,.8,bodyMat,0,1.35,0);
box(receiver,.92,.5,.07,mat('#164b60',.2),0,1.4,.44);
for(const x of [-.82,.82]){sphere(receiver,.21,jointMat,x,1.75,0);box(receiver,.3,.85,.37,bodyMat,x,1.17,0)}
for(const x of [-.38,.38]){box(receiver,.35,.75,.4,jointMat,x,.43,0)}
cyl(receiver,.24,.24,.2,M.steel,0,2.02,0);
const navArrow=new THREE.Group();robot.add(navArrow);navArrow.position.set(0,4.35,0);navArrow.scale.setScalar(.75);
const navMat=new THREE.MeshStandardMaterial({color:0xffd74e,emissive:0xffac16,emissiveIntensity:.9});

const navShape=new THREE.Shape();

navArrow.visible=false;
let winTime=0;
// Cabeza 3D del robot: carcasa, ojos, boca, orejas y antena.
const head=new THREE.Group();scene.add(head);
const shell=mat('#c8d9e5',.48,.32),face=mat('#18374c',.25,.36),eye=mat('#27e8d0',.12,.25);
box(head,.9,.78,.7,shell,0,.5,0);
box(head,.72,.55,.055,face,0,.54,.375);
box(head,.16,.16,.045,eye,-.19,.64,.411);
box(head,.16,.16,.045,eye,.19,.64,.411);
box(head,.34,.055,.048,eye,0,.39,.414);
box(head,.16,.26,.26,M.steel,-.53,.54,0);
box(head,.16,.26,.26,M.steel,.53,.54,0);
cyl(head,.045,.045,.24,M.steel,0,1.01,0);
sphere(head,.11,M.red,0,1.17,0);
const headSpawnX=(Math.random()<.5?-1:1)*(2.2+Math.random()*1.7);const headSpawnZ=25+Math.random()*5;
head.position.set(headSpawnX,0,headSpawnZ);head.rotation.y=Math.PI;
// Indicador flotante: flecha luminosa apuntando hacia la cabeza.
const headMarker=new THREE.Group();scene.add(headMarker);
const arrowMat=new THREE.MeshStandardMaterial({color:0x22f3c8,emissive:0x08a78c,emissiveIntensity:.65,metalness:.15,roughness:.25});
const arrowStem=cyl(headMarker,.075,.075,.57,arrowMat,0,.48,0);
const arrowTip=new THREE.Mesh(new THREE.ConeGeometry(.29,.46,4),arrowMat);arrowTip.rotation.z=Math.PI;arrowTip.position.y=.08;headMarker.add(arrowTip);

const headHome=new THREE.Vector3(0,.47,0);
let pickupTime=0, pickupActive=false;
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
function panel(){if(step===5){mode='race';$('#panel').style.display='none';$('#controls').style.display='flex';$('#phase').textContent='FASE 2 · CARRERA 3D';$('#message').textContent='Explora la pista y sigue la flecha verde para encontrar la cabeza 🤖';$('#orbitHint').style.display='none';$('#progress').style.display='none';all.forEach(g=>g.visible=true);showcaseAnchor.visible=false;return}
const p=descriptions[step];$('#heading').textContent=p[0];$('#desc').textContent=p[1];$('#counter').textContent='Componente '+(step+1)+' de 5';$('#progress').textContent='Ensamblado: '+step+'/5';$('#checks').innerHTML=descriptions.map((_,i)=>'<div class="check '+(i<step?'done':'')+'"></div>').join('');

$('#assemble').onclick=()=>{if(animating)return;animating=true;$('#assemble').disabled=true;const target=all[step];target.visible=true;target.scale.setScalar(.05);if(showcase){spinPivot.remove(showcase);showcase=null}const begin=performance.now();function grow(t){let k=Math.min(1,(t-begin)/650);target.scale.setScalar(.05+.95*(1-(1-k)**3));if(k<1)requestAnimationFrame(grow);else{target.scale.setScalar(1);step++;animating=false;$('#assemble').disabled=false;panel()}}requestAnimationFrame(grow)};

document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;b.classList.add('pressed')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('pressed')});b.addEventListener('contextmenu',e=>e.preventDefault())});
addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){e.preventDefault();keys[k]=true}if(e.code==='Space'){e.preventDefault();grab()}});

 if(pickupTime<1.1){const t=smooth(pickupTime/1.1);shoulderAngle=lerp(.8,1.85,t);elbowAngle=lerp(.7,.55,t);}

 }else if(pickupTime<2.55){const t=smooth((pickupTime-1.45)/1.1);shoulderAngle=lerp(1.85,.8,t);elbowAngle=lerp(.55,.7,t);}
