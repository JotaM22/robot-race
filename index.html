<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Robot Race</title><style>
*{box-sizing:border-box}body{margin:0;background:#071322;color:#f3f8ff;font-family:system-ui,Arial;overflow:hidden}button{font:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;border:0;border-radius:12px;padding:13px 20px;font-weight:800;background:#13d8ad;color:#062b2b}button:disabled{opacity:.45}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}.brand{font-weight:1000;font-size:clamp(20px,4vw,30px);letter-spacing:2px}.pill{background:#10283de8;padding:9px 14px;border:1px solid #34516a;border-radius:20px;font-size:13px}#scene{width:100vw;height:100dvh;display:block;touch-action:none}#panel{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(94vw,650px);background:#0d2338ee;border:1px solid #41607a;border-radius:22px;padding:18px;z-index:6;box-shadow:0 12px 45px #0009}#panel h2{margin:0 0 8px;font-size:clamp(20px,4vw,28px)}#panel p{font-size:clamp(14px,2.6vw,18px);line-height:1.5;margin:6px 0 15px;color:#d1e1ef}.panelrow{display:flex;gap:12px;align-items:center;justify-content:space-between}.count{font-size:13px;color:#8deed8}.checks{display:flex;gap:6px;margin-top:12px}.check{height:7px;flex:1;border-radius:5px;background:#34526a}.check.done{background:#13d8ad}#controls{position:absolute;bottom:18px;left:50%;right:auto;transform:translateX(-50%);display:none;justify-content:center;align-items:end;gap:22px;pointer-events:none;z-index:7}.pad{display:grid;grid-template-columns:repeat(3,64px);gap:5px;pointer-events:auto}.pad button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;padding:0;width:64px;height:64px;font-size:26px;touch-action:none;background:#183f5fe8;color:white;border:1px solid #6c9ebd}.pad .empty{visibility:hidden}.actions{display:flex;flex-direction:column;gap:9px;pointer-events:auto}.actions button{min-width:110px;background:#e7a944;color:#1c2030}#message{position:absolute;top:68px;left:50%;transform:translateX(-50%);z-index:5;background:#0b253bdc;border-radius:12px;padding:10px 18px;text-align:center;max-width:85vw}#help{position:absolute;top:135px;bottom:auto;pointer-events:none;left:50%;transform:translateX(-50%);font-size:13px;color:#9ab8d0;text-align:center;width:90vw}#part{position:absolute;top:22%;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;transition:all .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 12px 20px #0008)}#part.fly{top:49%;left:50%;opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(45deg)}.component{position:relative;width:120px;height:90px;display:grid;place-items:center}.motor{width:105px;height:53px;background:linear-gradient(135deg,#9ea8b5,#485c70);border-radius:14px;border:5px solid #d3dce4;box-shadow:inset -15px -8px #334558}.motor:after{content:'';position:absolute;width:45px;height:12px;background:#e5bb58;right:-31px;border-radius:5px}.board{width:130px;height:80px;border-radius:8px;background:#126f90;border:5px solid #183d57;box-shadow:inset 0 0 0 8px #168eb4}.board:before{content:'ARDUINO';font-size:13px;color:white;letter-spacing:2px}.driver{width:110px;height:90px;background:#176b5c;border:5px solid #0a4338;border-radius:7px}.driver:before{content:'L298N';font-weight:900;background:#252c34;padding:13px;color:white}.servo{width:95px;height:64px;background:#1966b2;border:5px solid #9ac8ec;border-radius:9px}.servo:before{content:'⚙';font-size:45px;color:white;position:absolute;top:-32px}.chassis{width:130px;height:80px;background:#687a8e;border:7px solid #c2d0dc;border-radius:20px}.chassis:before{content:'CHASIS';font-size:14px;color:white}#partName{position:absolute;top:17%;width:100%;text-align:center;color:#83e8d5;font-weight:900;letter-spacing:2px}#restart{position:absolute;top:60px;right:12px;z-index:8;background:#183f5f;color:white;padding:8px 12px;font-size:12px} @media(max-width:500px){#panel{bottom:10px;padding:15px}#controls{bottom:12px}.pad{grid-template-columns:repeat(3,56px)}.pad button{width:56px;height:56px}#help{top:140px;bottom:auto}}
</style></head><body><div id="hud"><div class="brand">🤖 ROBOT <span style="color:#13d8ad">RACE</span></div><div class="pill" id="phase">FASE 1 · ENSAMBLAJE</div></div><button id="restart">↻ Reiniciar</button><canvas id="scene"></canvas><div id="partName"></div><div id="part"></div><div id="message">¡Construye tu robot para comenzar!</div><section id="panel"><h2 id="heading"></h2><p id="desc"></p><div class="panelrow"><span class="count" id="counter"></span><button id="assemble">Ensamblar →</button></div><div class="checks" id="checks"></div></section><div id="help"></div><div id="controls"><div class="pad"><span class="empty"></span><button data-key="up">▲</button><span class="empty"></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div class="actions"><button id="grab">✋ Tomar</button><button id="drop">📦 Soltar</button></div></div>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const parts=[{name:'Chasis',type:'chassis',description:'El chasis es la estructura que sostiene todos los componentes. Proporciona estabilidad y soporte mecánico al robot.'},{name:'Motores DC',type:'motor',description:'Los motores de corriente continua transforman energía eléctrica en movimiento rotatorio. Hacen girar las ruedas para desplazar el carrito.'},{name:'Driver L298N',type:'driver',description:'El L298N es un controlador de motores. Permite al Arduino cambiar el sentido de giro y regular la velocidad de los motores DC.'},{name:'Arduino',type:'board',description:'Arduino es el cerebro del robot. Ejecuta instrucciones, recibe información y envía señales a los motores y servomotores.'},{name:'Servomotores',type:'servo',description:'Los servomotores permiten controlar posiciones angulares precisas. Mueven las articulaciones del brazo y su pinza.'}];
function componentSVG(type){
const defs='<defs><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#f2f5f7"/><stop offset="1" stop-color="#63798c"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe890"/><stop offset="1" stop-color="#ae8029"/></linearGradient></defs>';
const wheel=(x,y)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="18" ry="28" fill="#18232c" stroke="#667b8b" stroke-width="3"/><ellipse cx="'+(x+3)+'" cy="'+y+'" rx="11" ry="19" fill="#f2bd28"/><circle cx="'+(x+3)+'" cy="'+y+'" r="4" fill="#74899b"/>';
const pcb=(color)=>'<path d="M40 95 L197 48 L294 109 L132 171Z" fill="'+color+'" stroke="#d3e5ef" stroke-width="3"/><path d="M132 171 L294 109 L294 122 L132 185Z" fill="#183a51"/>';
let art='';
if(type==='chassis')art=wheel(63,143)+wheel(259,109)+'<path d="M54 98 L203 56 L294 110 L139 161Z" fill="#819bac" fill-opacity=".5" stroke="#e2ebef" stroke-width="4"/><path d="M85 99 L201 69 L266 108 L142 146Z" fill="#293e4f" fill-opacity=".55" stroke="#d9e8f0" stroke-width="2"/>'+[[89,100],[201,68],[264,111],[141,149],[167,101],[203,123]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#172e40" stroke="#d5b46b" stroke-width="2"/>').join('')+wheel(135,177)+wheel(294,144);
if(type==='motor')art='<path d="M46 96 L113 77 L149 102 L81 122Z" fill="#ffe05c"/><path d="M46 96 L81 122 L81 164 L46 140Z" fill="#c79d28"/><path d="M81 122 L149 102 L149 144 L81 164Z" fill="url(#gold)"/><path d="M146 103 L214 83 L253 107 L184 129Z" fill="url(#metal)" stroke="#e9f2f8" stroke-width="2"/><path d="M184 129 L253 107 L253 151 L184 172Z" fill="#8194a3"/><path d="M146 103 L184 129 L184 172 L146 144Z" fill="#657d8d"/><ellipse cx="253" cy="130" rx="12" ry="22" fill="#506879" stroke="#dae7ed" stroke-width="2"/><path d="M260 127 L299 115 L299 130 L260 142Z" fill="url(#metal)"/><path d="M55 140 Q15 156 35 187" stroke="#ee5353" fill="none" stroke-width="4"/><path d="M66 150 Q37 172 57 201" stroke="#222" fill="none" stroke-width="4"/>';
if(type==='driver')art=pcb('#d3353e')+Array.from({length:7},(_,i)=>'<path d="M'+(117+i*12)+' '+(98-i*3)+' v-52 l9 -3 v52Z" fill="#29343f" stroke="#8e9eab"/>').join('')+'<path d="M120 108 L204 83 L241 109 L157 137Z" fill="#1e2932" stroke="#a4b5c2" stroke-width="2"/><path d="M65 106 L103 95 L128 112 L90 125Z M248 103 L277 94 L298 109 L269 119Z" fill="#1479bd" stroke="#a9ddf8" stroke-width="2"/><text x="160" y="161" fill="white" font-size="17" font-weight="bold" transform="rotate(-18 160 161)">L298N</text>';
if(type==='board')art=pcb('#087cb0')+'<path d="M68 106 L107 95 L133 115 L94 128Z" fill="url(#metal)" stroke="#f1f6f9" stroke-width="2"/><path d="M124 114 L206 89 L239 111 L156 138Z" fill="#1a2935" stroke="#a9c2d0" stroke-width="2"/>'+Array.from({length:10},(_,i)=>'<path d="M'+(131+i*8)+' '+(112-i*2)+' v-5" stroke="#d9e2e9" stroke-width="2"/>').join('')+'<path d="M211 75 L261 61 L292 80 L243 96Z" fill="#202c38"/><text x="182" y="160" fill="white" font-size="20" font-weight="bold" transform="rotate(-18 182 160)">UNO</text>';
if(type==='servo')art='<path d="M69 99 L170 70 L260 121 L158 154Z" fill="#267cd3" stroke="#a3d3ff" stroke-width="3"/><path d="M69 99 L158 154 L158 194 L69 140Z" fill="#124c92"/><path d="M158 154 L260 121 L260 163 L158 194Z" fill="#145fae"/><path d="M100 98 L168 79 L225 112 L157 134Z" fill="#10336e" stroke="#8cb6eb" stroke-width="2"/><ellipse cx="165" cy="110" rx="20" ry="11" fill="#eaf1f6" stroke="#b5c8d6" stroke-width="3"/><path d="M164 109 L225 72 L241 80 L174 119Z" fill="#f4f7f9" stroke="#b2c4d0" stroke-width="3"/><rect x="176" y="150" width="47" height="24" rx="2" fill="#17283b" stroke="#e8bf43"/><text x="181" y="167" font-size="15" font-weight="bold" fill="#f3d34c">SG90</text><path d="M90 148 Q44 165 53 196" stroke="#e94f51" fill="none" stroke-width="4"/><path d="M101 154 Q70 186 80 205" stroke="#e5ac37" fill="none" stroke-width="4"/><path d="M112 160 Q91 191 108 215" stroke="#242a33" fill="none" stroke-width="4"/>';
return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 235" width="min(78vw,340px)" style="height:auto;max-height:230px;overflow:visible;filter:drop-shadow(0 14px 12px #0008)" aria-label="'+type+'">'+defs+art+'</svg>';
}
let step=0,mode='build',robot={x:0,z:0,angle:0},carrying=false,object={x:0,z:13},keys={},last=0,anim=0;
const $=s=>document.querySelector(s);function panel(){if(step>=parts.length){mode='race';$('#panel').style.display='none';$('#part').style.display='none';$('#partName').style.display='none';$('#controls').style.display='flex';$('#phase').textContent='FASE 2 · CARRERA';$('#message').textContent='Conduce hasta el cubo amarillo, tómalo y llévalo a la meta';$('#help').textContent='▲▼ avanzar / retroceder · ◀▶ girar · ✋ recoger · 📦 entregar';return}let p=parts[step];$('#heading').textContent=p.name;$('#desc').textContent=p.description;$('#counter').textContent='Componente '+(step+1)+' de '+parts.length;$('#part').innerHTML=componentSVG(p.type);$('#part').classList.remove('fly');$('#partName').textContent=p.name;$('#checks').innerHTML=parts.map((_,i)=>'<div class="check '+(i<step?'done':'')+'"></div>').join('');$('#message').textContent='Robot en construcción · '+step+'/'+parts.length+' componentes'}panel();
$('#assemble').onclick=()=>{if(anim)return;anim=1;$('#assemble').disabled=true;$('#part').classList.add('fly');setTimeout(()=>{step++;anim=0;$('#assemble').disabled=false;panel()},750)};
$('#restart').onclick=()=>location.reload();
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[{ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key]=true;if(e.key===' ')grab()});addEventListener('keyup',e=>keys[{ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key]=false);
function distance(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}function grab(){if(mode!=='race'||carrying)return;if(distance(robot,object)<2.7){carrying=true;$('#message').textContent='¡Objeto recogido! Ahora llega a la meta'}else $('#message').textContent='Acércate al cubo amarillo para recogerlo'}function drop(){if(!carrying)return;if(robot.z>28&&Math.abs(robot.x)<4){mode='win';$('#message').textContent='🏆 ¡MISIÓN COMPLETADA! ¡Ganaste Robot Race!';$('#phase').textContent='¡VICTORIA!';$('#controls').style.display='none'}else{$('#message').textContent='Lleva el objeto a la zona verde antes de soltarlo';}}$('#grab').onclick=grab;$('#drop').onclick=drop;
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function rr(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function render(t){let dt=Math.min((t-last)/1000||0,.05);last=t;ctx.clearRect(0,0,W,H);let horizon=H*.42;ctx.fillStyle='#0a1b2e';ctx.fillRect(0,0,W,H);ctx.fillStyle='#102e3b';ctx.fillRect(0,horizon,W,H-horizon);let cx=W/2,cy=H*.48;
if(mode==='build'){let scale=Math.min(W/450,H/680,1.5),bx=cx,by=cy+25;ctx.save();ctx.translate(bx,by);ctx.scale(scale,scale);ctx.globalAlpha=.25;drawRobot(0,0,1);ctx.globalAlpha=1;for(let i=0;i<step;i++){ctx.fillStyle='#12d9a9';ctx.font='bold 19px system-ui';ctx.fillText('✓',-100+i*44,135)}ctx.restore();ctx.strokeStyle='#2c627a';ctx.lineWidth=1;for(let i=0;i<12;i++){let y=horizon+(H-horizon)*i/12;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
else{if(mode==='race'){if(keys.left)robot.angle-=2.1*dt;if(keys.right)robot.angle+=2.1*dt;let speed=(keys.up?1:0)-(keys.down?1:0);let nx=robot.x+Math.sin(robot.angle)*speed*7*dt,nz=robot.z+Math.cos(robot.angle)*speed*7*dt;if(Math.abs(nx)<5.1&&nz>-2&&nz<34){robot.x=nx;robot.z=nz}}// Cámara solidaria al robot: el suelo se desplaza hacia abajo al avanzar y gira al doblar.
const ca=Math.cos(robot.angle),sa=Math.sin(robot.angle);
function project(x,z){
 const dx=x-robot.x,dz=z-robot.z;
 const side=dx*ca-dz*sa,forward=dx*sa+dz*ca;
 const depth=forward+7;
 if(depth<=.3)return null;
 const focal=Math.min(W*1.05,H*.95),groundY=H*.94;
 const scale=focal/(depth+5);
 return [cx+side*scale,groundY-3.3*scale,scale/45];
}
function line(a,b,color,width=1){if(!a||!b)return;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function quad(x1,z1,x2,z2,color){const p=[project(x1,z1),project(x2,z1),project(x2,z2),project(x1,z2)];if(p.every(Boolean))poly(p,color)}
// Tramos de piso en perspectiva real, dibujados del fondo hacia la cámara.
for(let z=Math.ceil((robot.z+60)/2)*2;z>=robot.z-10;z-=2){
 for(let x=-6;x<6;x+=2){
  const n=(Math.floor(z/2)+Math.floor(x/2))%2;
  quad(x,z-2,x+2,z,n?'#304c58':'#3a5964');
 }
}
for(let x=-6;x<=6;x+=2)line(project(x,robot.z-8),project(x,robot.z+60),'#88a5aa55');
for(let z=Math.floor((robot.z-8)/2)*2;z<robot.z+60;z+=2)line(project(-6,z),project(6,z),'#a5bdc044');
for(let z=Math.floor((robot.z-8)/4)*4;z<robot.z+60;z+=4)quad(-.13,z,.13,z+2,'#f1c05a');
for(let z=Math.floor((robot.z-8)/3)*3;z<robot.z+60;z+=3){for(let x of [-7,7]){const p=project(x,z);if(p&&p[1]<H+30&&p[1]>0){ctx.beginPath();ctx.arc(p[0],p[1],Math.max(1,9*p[2]),0,Math.PI*2);ctx.fillStyle='#648e6d';ctx.fill()}}}
const goal=project(0,30);
if(goal&&goal[1]>0&&goal[1]<H){const a=project(-5,30),b=project(5,30);line(a,b,'#12edaa',Math.max(5,18*goal[2]));ctx.fillStyle='#dcfff6';ctx.font='bold 16px system-ui';ctx.fillText('META',goal[0]-22,goal[1]-17)}
if(!carrying){const o=project(object.x,object.z);if(o&&o[1]>0&&o[1]<H){const sz=Math.max(7,45*o[2]);rr(o[0]-sz/2,o[1]-sz,sz,sz,3,'#ffc447')}}
ctx.save();ctx.translate(cx,H*.77);ctx.scale(Math.min(W/420,1.2),Math.min(W/420,1.2));drawRobot(0,0,1);if(carrying){rr(-12,-115,24,24,3,'#ffc447')}ctx.restore();if(mode==='win'){ctx.fillStyle='#0a1b2ecc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.fillText('🏆 ¡VICTORIA!',cx,H*.45);ctx.font='18px system-ui';ctx.fillText('Completaste la misión',cx,H*.51);ctx.textAlign='left'}}
requestAnimationFrame(render)}
function drawRobot(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);poly([[-105,30],[-75,-15],[70,-15],[105,30],[65,77],[-65,77]],'#5f879b','#a4cad8');for(let a of [-1,1]){rr(a*77-18,12,36,65,13,'#17212d');rr(a*77-13,21,26,45,10,'#293c4d')}poly([[-75,-22],[-45,-55],[48,-55],[76,-22],[54,32],[-53,32]],'#198fa0','#6ed7dc');rr(-32,-42,65,39,5,'#156580');ctx.fillStyle='#e1f9ff';ctx.font='bold 12px system-ui';ctx.fillText('ARDUINO',-25,-18);rr(30,5,40,27,4,'#1a7159');rr(39,8,20,20,2,'#26323b');ctx.strokeStyle='#b5d7e8';ctx.lineWidth=15;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(-15,-82);ctx.lineTo(22,-117);ctx.stroke();ctx.strokeStyle='#e8a846';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(-15,-82);ctx.lineTo(22,-117);ctx.stroke();for(let [a,b] of [[-15,-82],[22,-117]]){ctx.beginPath();ctx.arc(a,b,11,0,Math.PI*2);ctx.fillStyle='#d6e8ef';ctx.fill();ctx.beginPath();ctx.arc(a,b,5,0,Math.PI*2);ctx.fillStyle='#4b7891';ctx.fill()}ctx.strokeStyle='#d6e8ef';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(22,-117);ctx.lineTo(10,-135);ctx.moveTo(22,-117);ctx.lineTo(36,-135);ctx.stroke();ctx.restore()}
requestAnimationFrame(render);
</script></body></html>
